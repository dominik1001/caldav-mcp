name: Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # Create releases and commit version bumps
  issues: write # Comment on resolved issues
  pull-requests: write # Comment on merged PRs
  id-token: write # Generate OIDC token for npm trusted publishing

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Run Biome CI
        run: npm run check:ci

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Knip
        run: npm run knip

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci

      - name: Install Radicale
        run: pip install radicale

      - name: Configure Radicale
        run: |
          mkdir -p "$RUNNER_TEMP/radicale/collections"
          printf 'test:test\n' > "$RUNNER_TEMP/radicale/htpasswd"

      - name: Start Radicale
        run: |
          radicale \
            --storage-filesystem-folder "$RUNNER_TEMP/radicale/collections" \
            --auth-type htpasswd \
            --auth-htpasswd-filename "$RUNNER_TEMP/radicale/htpasswd" \
            --auth-htpasswd-encryption plain \
            --server-hosts 127.0.0.1:5232 &
          for _ in $(seq 1 30); do
            curl -fsS -u test:test http://127.0.0.1:5232/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "Radicale failed to start" >&2
          exit 1

      - name: Create test calendar
        run: |
          curl -fsS -X MKCOL -u test:test \
            -H "Content-Type: application/xml" \
            --data '<?xml version="1.0" encoding="utf-8" ?>
              <create xmlns="DAV:" xmlns:C="urn:ietf:params:xml:ns:caldav">
                <set><prop>
                  <resourcetype><collection/><C:calendar/></resourcetype>
                  <displayname>Test</displayname>
                </prop></set>
              </create>' \
            http://127.0.0.1:5232/test/default/

      - name: Run smoke
        run: |
          cat > .env <<EOF
          CALDAV_BASE_URL=http://127.0.0.1:5232
          CALDAV_USERNAME=test
          CALDAV_PASSWORD=test
          EOF
          TZ=Europe/Berlin npm run smoke

      - name: Run smoke over HTTP
        run: TZ=Europe/Berlin npm run smoke:http

  release:
    needs: [test, knip, smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Deploy key is a bypass actor on the main ruleset; GITHUB_TOKEN can't push the release commit
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Release
        id: release
        run: |
          before=$(jq -r .version package.json)
          npx semantic-release --repository-url git@github.com:langmail/caldav-mcp.git
          after=$(jq -r .version package.json)
          # @semantic-release/npm writes the new version into package.json only when it releases
          if [ "$after" != "$before" ]; then echo "version=$after" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: "0"
      # The registry checks that the npm version exists, and npm can answer
      # 404 for a minute or more right after publishing.
      - name: Wait for the version on npm
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for _ in $(seq 1 40); do
            npm view "caldav-mcp@$VERSION" version >/dev/null 2>&1 && exit 0
            echo "Waiting for caldav-mcp@$VERSION on npm..."
            sleep 15
          done
          echo "caldav-mcp@$VERSION did not appear on npm within 10 minutes" >&2
          exit 1
      # Runs here because a release created with GITHUB_TOKEN starts no other workflow
      - name: Publish to MCP Registry
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
